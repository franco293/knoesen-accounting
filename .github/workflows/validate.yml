name: Validate static release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, checked 2026-10-13
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, checked 2026-10-13
        with:
          python-version: '3.12'
      - name: Build, validate links and test release boundaries
        run: python -X utf8 publish.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, checked 2026-10-15
        with:
          node-version: '24'
          cache: npm
      - name: Install locked browser tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for the smoke checks
        run: npx playwright install --with-deps chromium
      - name: Check navigation, consent, fallbacks and readable pages
        run: npm run test:browser
      - name: Check cross-tab consent and unavailable storage
        run: npm run test:consent
      - name: Check dormant numeric input boundaries
        run: npm run test:tax-core
